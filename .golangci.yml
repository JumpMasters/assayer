# golangci-lint configuration (schema v2).
# Pinned to the same version the CI workflow installs.
version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose      # HTTP response bodies must be closed
    - copyloopvar    # loop-variable capture correctness
    - depguard       # the internal import graph recorded in ADR-0005
    - errorlint      # correct error wrapping / comparison
    - gocritic       # opinionated diagnostics
    - gosec          # security-focused static analysis
    - misspell       # spelling in comments and strings
    - nilerr         # returning nil after a non-nil error
    - revive         # style and documentation rules
    - unconvert      # redundant type conversions
    - unparam        # unused function parameters
    - whitespace     # leading/trailing whitespace
  settings:
    depguard:
              # depguard:begin — generated from internal/arch/classify_test.go. Do not edit by hand:
      # change the classification, run `go test ./internal/arch/`, and paste what it prints.
      rules:
        cmd-assayer:
          list-mode: lax
          files: ["**/cmd/assayer/*.go"]
          allow: [github.com/JumpMasters/assayer/internal/cli]
          deny:
            - pkg: github.com/JumpMasters/assayer
              desc: "cmd/assayer is class cmd: within this module it may import only internal/cli (ADR-0005)"
        adapter-claudecode-capture:
          list-mode: lax
          files: ["**/internal/adapter/claudecode/capture/*.go", "!$test"]
          allow: [github.com/JumpMasters/assayer/internal/assay, github.com/JumpMasters/assayer/internal/port]
          deny:
            - pkg: github.com/JumpMasters/assayer
              desc: "internal/adapter/claudecode/capture is class adapter: within this module it may import only internal/assay, internal/port (ADR-0005)"
        adapter-conformance:
          list-mode: lax
          files: ["**/internal/adapter/conformance/*.go", "!$test"]
          allow: [github.com/JumpMasters/assayer/internal/assay, github.com/JumpMasters/assayer/internal/port]
          deny:
            - pkg: github.com/JumpMasters/assayer
              desc: "internal/adapter/conformance is class adapter: within this module it may import only internal/assay, internal/port (ADR-0005)"
        arch:
          list-mode: lax
          files: ["**/internal/arch/*.go"]
          deny:
            - pkg: github.com/JumpMasters/assayer
              desc: "internal/arch is class standalone: it may import no other package in this module (ADR-0005)"
        assay:
          list-mode: lax
          files: ["**/internal/assay/*.go"]
          deny:
            - pkg: github.com/JumpMasters/assayer
              desc: "internal/assay is class leaf: it may import no other package in this module (ADR-0005)"
        buildinfo:
          list-mode: lax
          files: ["**/internal/buildinfo/*.go"]
          deny:
            - pkg: github.com/JumpMasters/assayer
              desc: "internal/buildinfo is class standalone: it may import no other package in this module (ADR-0005)"
        cli:
          list-mode: lax
          files: ["**/internal/cli/*.go"]
          allow: [github.com/JumpMasters/assayer/internal/app, github.com/JumpMasters/assayer/internal/assay, github.com/JumpMasters/assayer/internal/buildinfo]
          deny:
            - pkg: github.com/JumpMasters/assayer
              desc: "internal/cli is class root(cli): within this module it may import only internal/app, internal/assay, internal/buildinfo (ADR-0005)"
        port:
          list-mode: lax
          files: ["**/internal/port/*.go"]
          allow: [github.com/JumpMasters/assayer/internal/assay]
          deny:
            - pkg: github.com/JumpMasters/assayer
              desc: "internal/port is class ports: within this module it may import only internal/assay (ADR-0005)"
      # depguard:end
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: context-as-argument
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test files may use less strict error handling and assertions.
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/JumpMasters/assayer
